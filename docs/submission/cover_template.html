<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0a0e1a;}
.card{
  width:1200px;height:630px;
  background:radial-gradient(circle at 30% 40%, #112147 0%, #0a0e1a 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  position:relative;overflow:hidden;
}
.title{
  font-size:88px;font-weight:800;letter-spacing:-2px;
  background:linear-gradient(90deg,#ffffff 0%,#00d4ff 60%,#10b981 100%);
  -webkit-background-clip:text;color:transparent;
  margin:0 0 12px 0;text-shadow:0 4px 28px rgba(0,212,255,.25);
}
.sub{font-size:28px;letter-spacing:6px;color:#8ec5ff;margin:0 0 28px 0;text-transform:uppercase;}
.tag{font-size:22px;color:#cfe2ff;opacity:.85;max-width:900px;text-align:center;line-height:1.4;margin:0;}
.badges{display:flex;gap:16px;margin-top:34px;flex-wrap:wrap;justify-content:center;}
.b{padding:10px 18px;border-radius:24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);font-size:18px;color:#e8f4ff;}
.accent{color:#10b981;font-weight:700;}
.bar{width:140px;height:4px;background:linear-gradient(90deg,#00d4ff,#10b981);border-radius:2px;margin:6px 0 28px 0;}
.wave{position:absolute;bottom:0;left:0;width:100%;height:120px;
  background:linear-gradient(180deg,transparent 0%,rgba(0,212,255,.08) 100%);}
.foot{position:absolute;bottom:34px;font-size:16px;color:#94a3b8;letter-spacing:1px;}
</style></head><body>
<div class="card">
  <h1 class="title">OceanGuard AI</h1>
  <div class="bar"></div>
  <div class="sub">Marine Debris Intelligence</div>
  <p class="tag"><span class="accent">100% offline</span> on-device detection &amp; reports with <span class="accent">Gemma 4</span><br/>Single-conversation agentic tool calling &middot; 6 languages</p>
  <div class="badges">
    <span class="b">Powered by Gemma 4</span>
    <span class="b">LoRA mAP@0.5 +205%</span>
    <span class="b">Apache 2.0</span>
  </div>
  <div class="wave"></div>
  <div class="foot">github.com/asferrer/OceanguardAI-App &middot; Kaggle Gemma 4 Good Hackathon 2026</div>
</div>
</body></html>
