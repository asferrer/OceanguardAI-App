<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-label="Single-conversation agentic tool calling on Gemma 4">
  <title>OceanGuard AI — Single-Conversation Agentic Tool Calling on Gemma 4</title>
  <defs>
    <style>
      text { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; dominant-baseline: middle; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1225"/>
    </linearGradient>
    <linearGradient id="cyanEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="convGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="step1Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="step2Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="hdrViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="hdrEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="hdrCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="hdrAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arV" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#8b5cf6"/>
    </marker>
    <marker id="arE" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#10b981"/>
    </marker>
    <marker id="arC" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#00d4ff"/>
    </marker>
    <marker id="arA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#f59e0b"/>
    </marker>
    <marker id="arS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>

  <!-- Title -->
  <text x="700" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Single-Conversation Agentic Tool Calling on Gemma 4</text>
  <text x="700" y="66" text-anchor="middle" font-size="13" fill="#94A3B8">One LiteRT-LM conversation · warm KV cache · live token stream · canonical post-repair</text>
  <rect x="350" y="78" width="700" height="2" rx="1" fill="url(#cyanEmerald)"/>

  <!-- =================================================
       USER INPUT  (y: 100-160)
       ================================================= -->
  <rect x="540" y="100" width="320" height="60" rx="10" fill="#0f172a" stroke="#00d4ff" stroke-width="1.6"/>
  <rect x="540" y="100" width="320" height="22" rx="10" fill="url(#hdrCyan)"/>
  <text x="700" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">User · "Generate report"</text>
  <text x="700" y="142" text-anchor="middle" font-size="11" fill="#94A3B8">audience · language · session range</text>

  <line x1="700" y1="162" x2="700" y2="196" stroke="#FFFFFF" stroke-width="1.6" marker-end="url(#arS)"/>

  <!-- =================================================
       ONE CONVERSATION (outer container)  y: 200-580
       ================================================= -->
  <rect x="60" y="200" width="1280" height="382" rx="14" fill="url(#convGrad)" stroke="#00d4ff" stroke-width="1.8"/>
  <rect x="60" y="200" width="1280" height="36" rx="14" fill="url(#hdrCyan)"/>
  <rect x="60" y="226" width="1280" height="10" fill="url(#hdrCyan)"/>
  <text x="700" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#00d4ff">engine.generateWithTools(...) · single Conversation · KV cache persists across every turn</text>
  <text x="700" y="252" text-anchor="middle" font-size="11" fill="#a7e7ff">dataBundle = null → tokens stream to the UI · onToolCallStarted → UI "Querying &lt;tool&gt;…"</text>

  <!-- Step 1 box (Tool Dispatch)  y: 280-440 -->
  <rect x="100" y="278" width="600" height="282" rx="12" fill="url(#step1Grad)" stroke="#8b5cf6" stroke-width="1.4"/>
  <rect x="100" y="278" width="600" height="30" rx="12" fill="url(#hdrViolet)"/>
  <text x="400" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#c4b5fd">STEP 1 · Tool dispatch (warm KV)</text>

  <!-- 1.1 ToolAgentLoop -->
  <rect x="130" y="324" width="540" height="60" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="400" y="344" text-anchor="middle" font-size="12" font-weight="700" fill="#c4b5fd">ToolAgentLoop · MAX_TOOL_ROUNDS = 14</text>
  <text x="400" y="364" text-anchor="middle" font-size="10" fill="#94A3B8">automaticToolCalling = false · prefix-match dispatch · accepts partial drafts (≥ 300 chars)</text>

  <line x1="400" y1="386" x2="400" y2="408" stroke="#8b5cf6" stroke-width="1.4" marker-end="url(#arV)"/>

  <!-- 1.2 8 tools -->
  <rect x="130" y="410" width="540" height="100" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="130" y="410" width="540" height="24" rx="8" fill="url(#hdrAmber)"/>
  <text x="400" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#fbbf24">OceanGuardTools · 8 typed Kotlin @Tool methods</text>
  <text x="220" y="452" text-anchor="middle" font-size="10" fill="#cbd5e1">debris-summary</text>
  <text x="400" y="452" text-anchor="middle" font-size="10" fill="#cbd5e1">material-breakdown</text>
  <text x="580" y="452" text-anchor="middle" font-size="10" fill="#cbd5e1">type-breakdown</text>
  <text x="220" y="470" text-anchor="middle" font-size="10" fill="#cbd5e1">risk-assessment</text>
  <text x="400" y="470" text-anchor="middle" font-size="10" fill="#cbd5e1">collection-waypoints</text>
  <text x="580" y="470" text-anchor="middle" font-size="10" fill="#cbd5e1">survey-statistics</text>
  <text x="220" y="488" text-anchor="middle" font-size="10" fill="#cbd5e1">ecological-impacts</text>
  <text x="400" y="488" text-anchor="middle" font-size="10" fill="#cbd5e1">temporal-trend (zone)</text>
  <text x="580" y="488" text-anchor="middle" font-size="10" fill="#64748b">no-argument · O(1) lookup</text>

  <!-- 1.3 UI feedback callback -->
  <rect x="130" y="520" width="540" height="30" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="400" y="536" text-anchor="middle" font-size="11" font-weight="700" fill="#06b6d4">onToolCallStarted(name) → ReportGenerationState.ToolExecuting → UI banner</text>

  <!-- Step 2 box (Writing)  same conversation, immediately to the right -->
  <rect x="720" y="278" width="600" height="282" rx="12" fill="url(#step2Grad)" stroke="#10b981" stroke-width="1.4"/>
  <rect x="720" y="278" width="600" height="30" rx="12" fill="url(#hdrEmerald)"/>
  <text x="1020" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#10b981">STEP 2 · Report writing (same conversation)</text>

  <!-- 2.1 KV reuse explainer -->
  <rect x="750" y="324" width="540" height="60" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="1020" y="344" text-anchor="middle" font-size="12" font-weight="700" fill="#10b981">Continuation turn · no conversation reset</text>
  <text x="1020" y="364" text-anchor="middle" font-size="10" fill="#94A3B8">Tool responses already in KV cache · model writes report using verified tool data</text>

  <line x1="1020" y1="386" x2="1020" y2="408" stroke="#10b981" stroke-width="1.4" marker-end="url(#arE)"/>

  <!-- 2.2 Streaming markdown writer -->
  <rect x="750" y="410" width="540" height="100" rx="8" fill="#0f172a" stroke="#00d4ff" stroke-width="1.2"/>
  <rect x="750" y="410" width="540" height="24" rx="8" fill="url(#hdrCyan)"/>
  <text x="1020" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#00d4ff">Streaming markdown writer</text>
  <text x="1020" y="452" text-anchor="middle" font-size="10" fill="#94A3B8">Gemma 4 Text E2B · LiteRT-LM 0.11 · ~5 tok/s Vulkan / Xclipse 920</text>
  <text x="1020" y="470" text-anchor="middle" font-size="10" fill="#94A3B8">11 canonical class names · 3 audiences · 6 languages</text>
  <text x="1020" y="488" text-anchor="middle" font-size="10" fill="#64748b">"Copy tool-returned numbers verbatim — invent nothing"</text>

  <!-- 2.3 onPartialResult -->
  <rect x="750" y="520" width="540" height="30" rx="8" fill="#0f172a" stroke="#00d4ff" stroke-width="1.2"/>
  <text x="1020" y="536" text-anchor="middle" font-size="11" font-weight="700" fill="#00d4ff">onPartialResult(text) → ReportGenerationState.StreamingText → UI live token stream</text>

  <!-- Inner arrow Step 1 → Step 2 (same conversation, white line) -->
  <line x1="702" y1="419" x2="718" y2="419" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arS)" opacity="0.85"/>
  <text x="710" y="402" text-anchor="middle" font-size="9" fill="#cbd5e1" opacity="0.85">same Conv</text>

  <!-- =================================================
       POST-PROCESS (bottom)   y: 600-700
       ================================================= -->
  <line x1="1020" y1="562" x2="1020" y2="608" stroke="#10b981" stroke-width="1.6" marker-end="url(#arE)"/>

  <!-- Post-process repair -->
  <rect x="380" y="608" width="640" height="80" rx="10" fill="#0f172a" stroke="#94A3B8" stroke-width="1.4"/>
  <rect x="380" y="608" width="640" height="24" rx="10" fill="#1e293b"/>
  <text x="700" y="624" text-anchor="middle" font-size="12" font-weight="700" fill="#cbd5e1">repairHallucinations(raw, canon) · post-process</text>
  <text x="700" y="650" text-anchor="middle" font-size="10" fill="#94A3B8">Canon comes from ToolDataBundleFormatter (offline) — never injected into the model</text>
  <text x="700" y="668" text-anchor="middle" font-size="10" fill="#94A3B8">Section-aware rewrite of any row whose label matches the canonical map · NFD-normalised matching</text>
  <text x="700" y="682" text-anchor="middle" font-size="10" fill="#64748b">Corrupt dates (5+ consecutive digits) restored or left untouched — no lossy substitution</text>

  <!-- Validator -->
  <line x1="1022" y1="648" x2="1080" y2="648" stroke="#10b981" stroke-width="1.6" marker-end="url(#arE)"/>
  <rect x="1080" y="608" width="280" height="80" rx="10" fill="#0a1628" stroke="#10b981" stroke-width="1.4"/>
  <rect x="1080" y="608" width="280" height="22" rx="10" fill="url(#hdrEmerald)"/>
  <text x="1220" y="624" text-anchor="middle" font-size="12" font-weight="700" fill="#10b981">ReportValidator · 12+ checks</text>
  <text x="1220" y="650" text-anchor="middle" font-size="10" fill="#94A3B8">classes · percent-sum · dates · GPS</text>
  <text x="1220" y="668" text-anchor="middle" font-size="10" fill="#94A3B8">repetition · placeholders · health tone</text>
  <text x="1220" y="684" text-anchor="middle" font-size="10" fill="#64748b">validationScore 0–100 persisted</text>

  <!-- Retry & tier downgrade (left of repair) -->
  <line x1="378" y1="648" x2="320" y2="648" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arS)"/>
  <text x="349" y="635" text-anchor="middle" font-size="9" fill="#94A3B8" opacity="0.85">retry on error</text>
  <rect x="200" y="608" width="120" height="80" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" opacity="0.92"/>
  <text x="260" y="624" text-anchor="middle" font-size="11" font-weight="700" fill="#cbd5e1">Tier downgrade</text>
  <text x="260" y="650" text-anchor="middle" font-size="10" fill="#94A3B8">if Gemma 4 fails</text>
  <text x="260" y="668" text-anchor="middle" font-size="10" fill="#94A3B8">retry smaller tier</text>
  <text x="260" y="684" text-anchor="middle" font-size="9" fill="#64748b">with backoff</text>

  <!-- =================================================
       LEGEND   y: 730-790
       ================================================= -->
  <rect x="60" y="730" width="1280" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.9"/>

  <line x1="80" y1="760" x2="110" y2="760" stroke="#00d4ff" stroke-width="2"/>
  <text x="120" y="760" font-size="10" fill="#cbd5e1">Single Conversation</text>

  <line x1="270" y1="760" x2="300" y2="760" stroke="#8b5cf6" stroke-width="2"/>
  <text x="310" y="760" font-size="10" fill="#cbd5e1">Step 1 · tool dispatch</text>

  <line x1="460" y1="760" x2="490" y2="760" stroke="#10b981" stroke-width="2"/>
  <text x="500" y="760" font-size="10" fill="#cbd5e1">Step 2 · writing</text>

  <line x1="620" y1="760" x2="650" y2="760" stroke="#f59e0b" stroke-width="2"/>
  <text x="660" y="760" font-size="10" fill="#cbd5e1">Kotlin tool layer</text>

  <line x1="780" y1="760" x2="810" y2="760" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="820" y="760" font-size="10" fill="#cbd5e1">Post-process &amp; validate</text>

  <text x="1320" y="760" text-anchor="end" font-size="10" fill="#64748b">Figure 2 · Agentic tool calling on Gemma 4</text>
</svg>
