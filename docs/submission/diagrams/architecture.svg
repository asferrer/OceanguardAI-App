<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" role="img" aria-label="OceanGuard AI on-device architecture (Gemma 4)">
  <title>OceanGuard AI — On-Device Architecture (Gemma 4)</title>
  <defs>
    <style>
      text { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; dominant-baseline: middle; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1225"/>
    </linearGradient>
    <linearGradient id="cyanEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="hdrCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="hdrEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="hdrBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="hdrViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="hdrAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.04"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#00d4ff"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#6366f1"/>
    </marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#64748b"/>
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1300" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="650" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">OceanGuard AI — On-Device Architecture</text>
  <text x="650" y="68" text-anchor="middle" font-size="13" fill="#94A3B8">Powered by Gemma 4 E2B · 100% Offline · Apache 2.0</text>
  <rect x="350" y="80" width="600" height="2" rx="1" fill="url(#cyanEmerald)"/>

  <!-- ============================================================
       ROW 1 — Camera / Gallery Input  (y: 110-180)
       ============================================================ -->
  <rect x="490" y="110" width="320" height="70" rx="10" fill="#0f172a" stroke="#00d4ff" stroke-width="1.6"/>
  <rect x="490" y="110" width="320" height="28" rx="10" fill="url(#hdrCyan)"/>
  <rect x="490" y="130" width="320" height="8" fill="url(#hdrCyan)"/>
  <text x="650" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Camera · Gallery · Batch Input</text>
  <text x="650" y="156" text-anchor="middle" font-size="11" fill="#94A3B8">JPEG capture · Multi-pick · Underwater housing UI</text>

  <line x1="650" y1="182" x2="650" y2="216" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- ============================================================
       ROW 2 — Gemma 4 Vision E2B  (y: 220-340)
       ============================================================ -->
  <rect x="320" y="220" width="660" height="120" rx="12" fill="#0a1628" stroke="#00d4ff" stroke-width="2"/>
  <rect x="320" y="220" width="660" height="32" rx="12" fill="url(#hdrCyan)"/>
  <rect x="320" y="246" width="660" height="6" fill="url(#hdrCyan)"/>
  <g transform="translate(346, 226)">
    <polygon points="10,2 12.5,8.5 19.5,9 14,13.5 16,20 10,16.5 4,20 6,13.5 0.5,9 7.5,8.5" fill="none" stroke="#00d4ff" stroke-width="1.6"/>
  </g>
  <text x="650" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#00d4ff">Gemma 4 Vision E2B</text>
  <text x="650" y="278" text-anchor="middle" font-size="12" fill="#FFFFFF">Open-vocabulary marine debris detection</text>
  <text x="650" y="298" text-anchor="middle" font-size="11" fill="#94A3B8">JSON output: {box_2d, label, material} · 50 fine-grained classes → 11 canonical families</text>
  <text x="650" y="318" text-anchor="middle" font-size="11" fill="#94A3B8">LiteRT-LM 0.11.0 · ~2.6 GB litert-lm package · CPU + Vulkan/Xclipse 920</text>

  <line x1="650" y1="342" x2="650" y2="376" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- ============================================================
       ROW 3 — DetectionOrchestrator + Room v11  (y: 380-470)
       ============================================================ -->
  <rect x="160" y="380" width="320" height="90" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.6"/>
  <rect x="160" y="380" width="320" height="28" rx="10" fill="url(#hdrBlue)"/>
  <rect x="160" y="400" width="320" height="8" fill="url(#hdrBlue)"/>
  <text x="320" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#a5b4fc">DetectionOrchestrator</text>
  <text x="320" y="426" text-anchor="middle" font-size="11" fill="#94A3B8">Canonicalize to 11-class taxonomy</text>
  <text x="320" y="444" text-anchor="middle" font-size="11" fill="#94A3B8">Confidence derivation · NMS</text>
  <text x="320" y="460" text-anchor="middle" font-size="10" fill="#64748b">DebrisType.canonical() · realistic per-detection confidence</text>

  <rect x="820" y="380" width="320" height="90" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.6"/>
  <rect x="820" y="380" width="320" height="28" rx="10" fill="url(#hdrBlue)"/>
  <rect x="820" y="400" width="320" height="8" fill="url(#hdrBlue)"/>
  <g transform="translate(842, 388)">
    <ellipse cx="10" cy="3.5" rx="10" ry="3.5" fill="none" stroke="#6366f1" stroke-width="1.4"/>
    <line x1="0" y1="3.5" x2="0" y2="12" stroke="#6366f1" stroke-width="1.4"/>
    <line x1="20" y1="3.5" x2="20" y2="12" stroke="#6366f1" stroke-width="1.4"/>
    <ellipse cx="10" cy="12" rx="10" ry="3.5" fill="none" stroke="#6366f1" stroke-width="1.4"/>
  </g>
  <text x="980" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#a5b4fc">Room Database v11</text>
  <text x="980" y="426" text-anchor="middle" font-size="11" fill="#94A3B8">DetectionSession · GeneratedReport</text>
  <text x="980" y="444" text-anchor="middle" font-size="11" fill="#94A3B8">MarineDexEntry · Achievement</text>
  <text x="980" y="460" text-anchor="middle" font-size="10" fill="#64748b">SQLite · KSP2 · canonical taxonomy migration</text>

  <line x1="482" y1="425" x2="818" y2="425" stroke="#6366f1" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <rect x="610" y="412" width="80" height="20" rx="4" fill="#0f172a" stroke="#6366f1" stroke-width="0.8"/>
  <text x="650" y="424" text-anchor="middle" font-size="10" fill="#a5b4fc">persist</text>

  <line x1="980" y1="472" x2="800" y2="514" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowSlate)"/>
  <text x="910" y="495" font-size="10" fill="#94A3B8">query</text>

  <line x1="320" y1="472" x2="500" y2="514" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
  <text x="378" y="495" font-size="10" fill="#94A3B8">sessions</text>

  <!-- ============================================================
       ROW 4 — ToolReportContext + OceanGuardTools  (y: 510-610)
       ============================================================ -->
  <rect x="220" y="510" width="380" height="100" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.6"/>
  <rect x="220" y="510" width="380" height="28" rx="10" fill="url(#hdrViolet)"/>
  <rect x="220" y="530" width="380" height="8" fill="url(#hdrViolet)"/>
  <text x="410" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#c4b5fd">ToolReportContext</text>
  <text x="410" y="558" text-anchor="middle" font-size="11" fill="#94A3B8">Pre-computed aggregates · O(1) lookup</text>
  <text x="410" y="578" text-anchor="middle" font-size="11" fill="#94A3B8">Material / type / risk maps · GPS waypoints</text>
  <text x="410" y="596" text-anchor="middle" font-size="10" fill="#64748b">ToolDataBundleFormatter → canon for post-repair (offline; never sent to model)</text>

  <rect x="700" y="510" width="380" height="100" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.6"/>
  <rect x="700" y="510" width="380" height="28" rx="10" fill="url(#hdrAmber)"/>
  <rect x="700" y="530" width="380" height="8" fill="url(#hdrAmber)"/>
  <text x="890" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24">OceanGuardTools</text>
  <text x="890" y="558" text-anchor="middle" font-size="11" fill="#94A3B8">8 typed Kotlin @Tool methods · no-argument calls</text>
  <text x="890" y="578" text-anchor="middle" font-size="11" fill="#94A3B8">debris-summary · material-breakdown · type-breakdown</text>
  <text x="890" y="596" text-anchor="middle" font-size="11" fill="#94A3B8">risk-assessment · waypoints · trend · impacts · stats</text>

  <line x1="602" y1="560" x2="698" y2="560" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrowViolet)"/>

  <line x1="650" y1="612" x2="650" y2="646" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- ============================================================
       ROW 5 — Agentic Tool Calling  (y: 650-770)
       ============================================================ -->
  <rect x="160" y="650" width="980" height="120" rx="12" fill="#0a1628" stroke="#00d4ff" stroke-width="2"/>
  <rect x="160" y="650" width="980" height="30" rx="12" fill="url(#hdrCyan)"/>
  <rect x="160" y="674" width="980" height="6" fill="url(#hdrCyan)"/>
  <text x="650" y="668" text-anchor="middle" font-size="14" font-weight="700" fill="#00d4ff">Single-Conversation Agentic Tool Calling · Gemma 4 Text E2B</text>

  <rect x="200" y="694" width="430" height="64" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="415" y="712" text-anchor="middle" font-size="12" font-weight="700" fill="#c4b5fd">STEP 1 · Tool dispatch</text>
  <text x="415" y="732" text-anchor="middle" font-size="10" fill="#94A3B8">ToolAgentLoop · max 14 rounds · 8 required tools</text>
  <text x="415" y="748" text-anchor="middle" font-size="10" fill="#64748b">automaticToolCalling = false · onToolCallStarted → UI</text>

  <rect x="670" y="694" width="430" height="64" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="885" y="712" text-anchor="middle" font-size="12" font-weight="700" fill="#10b981">STEP 2 · Report writing (warm KV)</text>
  <text x="885" y="732" text-anchor="middle" font-size="10" fill="#94A3B8">Same Conversation · tool responses in cache</text>
  <text x="885" y="748" text-anchor="middle" font-size="10" fill="#64748b">tokens stream live · onPartialResult → UI banner</text>

  <line x1="632" y1="726" x2="668" y2="726" stroke="#FFFFFF" stroke-width="1.6" marker-end="url(#arrowSlate)" opacity="0.7"/>

  <line x1="650" y1="772" x2="650" y2="806" stroke="#10b981" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- ============================================================
       ROW 6 — Streaming Output + Validator  (y: 810-870)
       ============================================================ -->
  <rect x="160" y="810" width="980" height="60" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
  <rect x="160" y="810" width="980" height="22" rx="10" fill="url(#hdrEmerald)"/>
  <rect x="160" y="824" width="980" height="8" fill="url(#hdrEmerald)"/>
  <text x="650" y="826" text-anchor="middle" font-size="12" font-weight="700" fill="#10b981">Streaming Output · Six languages · Three audience modes</text>

  <rect x="195" y="844" width="160" height="20" rx="6" fill="#10b981" fill-opacity="0.18"/>
  <text x="275" y="858" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">Streaming Markdown</text>

  <rect x="370" y="844" width="120" height="20" rx="6" fill="#6366f1" fill-opacity="0.20"/>
  <text x="430" y="858" text-anchor="middle" font-size="11" font-weight="600" fill="#a5b4fc">PDF Export</text>

  <rect x="505" y="844" width="120" height="20" rx="6" fill="#f59e0b" fill-opacity="0.20"/>
  <text x="565" y="858" text-anchor="middle" font-size="11" font-weight="600" fill="#fbbf24">CSV / COCO</text>

  <rect x="640" y="844" width="160" height="20" rx="6" fill="#00d4ff" fill-opacity="0.15"/>
  <text x="720" y="858" text-anchor="middle" font-size="11" font-weight="600" fill="#00d4ff">GeoJSON Export</text>

  <rect x="815" y="844" width="180" height="20" rx="6" fill="#94A3B8" fill-opacity="0.15"/>
  <text x="905" y="858" text-anchor="middle" font-size="11" font-weight="600" fill="#cbd5e1">ReportValidator (12+ checks)</text>

  <rect x="1010" y="844" width="125" height="20" rx="6" fill="#10b981" fill-opacity="0.18"/>
  <text x="1072" y="858" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">PDF · 6 langs</text>

  <!-- ============================================================
       SIDEBAR  (y: 220-540)
       ============================================================ -->
  <rect x="1160" y="220" width="130" height="120" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.3" opacity="0.95"/>
  <text x="1225" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#10b981" letter-spacing="0.5">ON-DEVICE ONLY</text>
  <line x1="1170" y1="256" x2="1280" y2="256" stroke="#10b981" stroke-width="0.6" opacity="0.5"/>
  <text x="1225" y="276" text-anchor="middle" font-size="10" fill="#94A3B8">No cloud calls</text>
  <text x="1225" y="294" text-anchor="middle" font-size="10" fill="#94A3B8">Offline-first</text>
  <text x="1225" y="312" text-anchor="middle" font-size="10" fill="#94A3B8">Galaxy S22 Ultra</text>
  <text x="1225" y="330" text-anchor="middle" font-size="10" fill="#94A3B8">Exynos 2200</text>

  <rect x="1160" y="360" width="130" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.9"/>
  <text x="1225" y="382" text-anchor="middle" font-size="11" font-weight="700" fill="#cbd5e1">Legend</text>
  <line x1="1170" y1="394" x2="1280" y2="394" stroke="#334155" stroke-width="0.6"/>

  <line x1="1176" y1="414" x2="1208" y2="414" stroke="#00d4ff" stroke-width="2"/>
  <text x="1218" y="414" font-size="10" fill="#cbd5e1">Gemma 4</text>

  <line x1="1176" y1="436" x2="1208" y2="436" stroke="#6366f1" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="1218" y="436" font-size="10" fill="#cbd5e1">Persistence</text>

  <line x1="1176" y1="458" x2="1208" y2="458" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="1218" y="458" font-size="10" fill="#cbd5e1">Context</text>

  <line x1="1176" y1="480" x2="1208" y2="480" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="1218" y="480" font-size="10" fill="#cbd5e1">Tool layer</text>

  <line x1="1176" y1="502" x2="1208" y2="502" stroke="#10b981" stroke-width="1.6"/>
  <text x="1218" y="502" font-size="10" fill="#cbd5e1">Output</text>

  <line x1="1176" y1="524" x2="1208" y2="524" stroke="#64748b" stroke-width="1.4"/>
  <text x="1218" y="524" font-size="10" fill="#cbd5e1">Data flow</text>

  <text x="650" y="892" text-anchor="middle" font-size="10" fill="#64748b">Figure 1 · OceanGuard AI architecture · Every step runs locally on the reference device · No cloud dependency at any stage.</text>
</svg>
