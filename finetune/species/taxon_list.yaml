# taxon_list.yaml — Semilla de taxones marinos para BioDex
#
# Fuente de AphiaIDs: WoRMS (World Register of Marine Species) https://www.marinespecies.org
# Los aphia_id marcados con null + TODO necesitan verificación manual en
# https://www.marinespecies.org/aphia.php?p=search
#
# Campos por taxón:
#   species_key:     identificador interno snake_case (inmutable, clave en el índice)
#   aphia_id:        WoRMS AphiaID (int) — null si pendiente de verificación
#   scientific_name: nombre científico aceptado (WoRMS)
#   common_names:    nombres comunes en 6 idiomas {en, es, fr, de, it, pt}
#   cosmopolitan:    true → exento del pre-filtro biogeográfico (distribución global)
#
# TODO: verificar y rellenar aphia_id nulos en https://www.marinespecies.org

